<div class="pf-menu" id="pfMenu">
  <button type="button" class="pf-trigger" id="pfTrigger" aria-haspopup="true" aria-expanded="false" aria-label="Menu profil">
    <span class="pf-ava">
      {% if current_user.foto %}<img src="{{ url_for('static', filename='uploads/profil/' ~ current_user.foto) }}" alt="">{% else %}{{ current_user.initial }}{% endif %}
    </span>
    <span class="pf-who"><b>{{ current_user.display_name }}</b><small>{{ current_user.role_label }}</small></span>
    <svg class="pf-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div class="pf-pop" id="pfPop" role="menu">
    <div class="pf-pop-head">
      <span class="pf-ava pf-ava-lg">
        {% if current_user.foto %}<img src="{{ url_for('static', filename='uploads/profil/' ~ current_user.foto) }}" alt="">{% else %}{{ current_user.initial }}{% endif %}
      </span>
      <div class="pf-pop-id">
        <b>{{ current_user.display_name }}</b>
        <small>{{ current_user.email }}</small>
        <em>{{ current_user.role_label }}</em>
      </div>
    </div>

    <a role="menuitem" href="{{ url_for('profile') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profil Saya
    </a>
    <a role="menuitem" href="{{ url_for('profile') }}#keamanan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Ubah Password
    </a>
    <div class="pf-sep"></div>
    <a role="menuitem" class="pf-out" href="{{ url_for('logout') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Keluar
    </a>
  </div>
</div>

<style>
@keyframes pfPopIn { from { opacity:0; transform:translateY(-8px) scale(.94); } to { opacity:1; transform:none; } }
@keyframes pfAvaPulse { 0% { box-shadow:0 0 0 0 rgba(255,233,149,.55); } 70% { box-shadow:0 0 0 9px rgba(255,233,149,0); } 100% { box-shadow:0 0 0 0 rgba(255,233,149,0); } }

.pf-menu { position:relative; flex-shrink:0; margin-left:14px; }
.pf-trigger { display:flex; align-items:center; gap:10px; padding:4px 12px 4px 4px; cursor:pointer; color:#fff; font-family:inherit;
              background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); border-radius:999px;
              transition:background .2s, transform .2s; }
.pf-trigger:hover, .pf-trigger[aria-expanded="true"] { background:rgba(255,255,255,.22); }
.pf-trigger:active { transform:scale(.97); }

.pf-ava { flex:none; width:38px; height:38px; display:grid; place-items:center; overflow:hidden; border-radius:50%;
          background:linear-gradient(135deg,#ffe995,#f5b52e); color:#0b2d5c; font-size:16px; font-weight:700; }
.pf-ava img { width:100%; height:100%; object-fit:cover; display:block; }
.pf-trigger .pf-ava { animation:pfAvaPulse 3s ease-out infinite; }
.pf-ava-lg { width:52px; height:52px; font-size:21px; }

.pf-who { display:flex; flex-direction:column; align-items:flex-start; line-height:1.2; max-width:150px; }
.pf-who b { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; font-weight:600; }
.pf-who small { font-size:11px; color:rgba(255,255,255,.75); }
.pf-chev { width:15px; height:15px; opacity:.8; transition:transform .25s ease; }
.pf-trigger[aria-expanded="true"] .pf-chev { transform:rotate(180deg); }

.pf-pop { position:absolute; right:0; top:calc(100% + 12px); width:290px; padding:8px; background:#fff; border-radius:20px;
          box-shadow:0 22px 48px rgba(11,45,92,.28); border:1px solid #e8ecf3; transform-origin:top right; display:none; z-index:1300; }
.pf-pop.open { display:block; animation:pfPopIn .25s cubic-bezier(.2,.9,.3,1.1); }
.pf-pop-head { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:6px; border-radius:14px; background:linear-gradient(135deg,#f3f7fd,#fffaf0); }
.pf-pop-head .pf-ava { box-shadow:0 8px 16px rgba(245,181,46,.35); }
.pf-pop-id { min-width:0; display:flex; flex-direction:column; gap:2px; }
.pf-pop-id b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#0b2d5c; font-size:14.5px; }
.pf-pop-id small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#5b6577; font-size:12px; }
.pf-pop-id em { align-self:flex-start; margin-top:3px; padding:2px 10px; border-radius:999px; background:#ffe995; color:#0b2d5c; font-style:normal; font-size:11px; font-weight:700; }

.pf-pop a { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; color:#0b2d5c; text-decoration:none; font-size:14px; font-weight:500;
            transition:background .18s, transform .18s; }
.pf-pop a svg { width:18px; height:18px; flex:none; }
.pf-pop a:hover { background:#eef3fa; transform:translateX(3px); }
.pf-pop a.pf-out { color:#b91c1c; }
.pf-pop a.pf-out:hover { background:#fee2e2; }
.pf-sep { height:1px; margin:6px 8px; background:#edf0f5; }

@media (max-width:640px) {
  .pf-menu { margin-left:auto; }
  .pf-who, .pf-chev { display:none; }
  .pf-trigger { padding:3px; }
  .pf-pop { position:fixed; right:12px; top:calc(var(--topbar-h) + 8px); width:min(290px, calc(100vw - 24px)); }
}
@media (prefers-reduced-motion:reduce) { .pf-trigger .pf-ava, .pf-pop.open { animation:none; } }
</style>

<script>
(function () {
  var trig = document.getElementById("pfTrigger");
  var pop = document.getElementById("pfPop");
  if (!trig || !pop) return;
  function set(open) {
    pop.classList.toggle("open", open);
    trig.setAttribute("aria-expanded", open ? "true" : "false");
  }
  trig.addEventListener("click", function (e) { e.stopPropagation(); set(!pop.classList.contains("open")); });
  document.addEventListener("click", function (e) { if (!pop.contains(e.target)) set(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") set(false); });
})();
</script>
