{% extends "base.html" %}
{% block content %}

<div class="fp-wrap">
  <div class="fp-card">
    <div class="fp-head">
      <div class="fp-icon">🔒</div>
      <h2>Reset Password</h2>
      <p>Masukkan email yang terdaftar. Kami akan mengirim tautan untuk mengatur ulang password.</p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}" class="fp-form">
      <label for="email">Alamat Email</label>
      <input type="email" name="email" id="email" placeholder="nama@kampus.ac.id" required>
      <button type="submit" class="fp-btn">Kirim Link Reset</button>
    </form>

    <div class="fp-foot">
      <a href="{{ url_for('login') }}">Kembali ke Login</a>
    </div>
  </div>
</div>

<style>
:root{ --navy:#0b2d5c; --yellow:#ffeb99; --bg:#fdfaf4; --ring:rgba(11,45,92,.25); }

.fp-wrap{
  width:100%; min-height:calc(100vh - 120px); display:flex; align-items:center; justify-content:center;
  background:var(--bg); padding:32px 16px;
}
.fp-card{
  width:min(560px,100%); background:#fff; border-radius:20px; box-shadow:0 20px 50px rgba(0,0,0,.06);
  padding:28px 26px;
}
.fp-head{text-align:center;}
.fp-icon{
  width:56px;height:56px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:28px;
  background:var(--yellow); color:var(--navy); box-shadow:0 6px 18px rgba(255,235,153,.45);
}
.fp-head h2{ margin:6px 0 6px; color:var(--navy); font-weight:800; }
.fp-head p{ margin:0 0 10px; color:#6b7280; }

.fp-form{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.fp-form label{ font-weight:700; color:var(--navy); }
.fp-form input{
  height:46px; border-radius:12px; border:1.6px solid #e5e7eb; padding:0 14px; outline:none;
  transition:border-color .15s, box-shadow .15s; background:#f8fbff;
}
.fp-form input:focus{ border-color:var(--navy); box-shadow:0 0 0 4px var(--ring); }

.fp-btn{
  height:48px; border:none; border-radius:999px; margin-top:4px; background:var(--navy); color:#fff;
  font-weight:800; cursor:pointer; transition:transform .15s, box-shadow .15s, background .15s;
}
.fp-btn:hover{ background:var(--yellow); color:var(--navy); box-shadow:0 8px 18px rgba(255,235,153,.4); transform:translateY(-1px); }

.fp-foot{ margin-top:10px; text-align:center; }
.fp-foot a{ color:var(--navy); font-weight:700; text-decoration:none; }
.fp-foot a:hover{ text-decoration:underline; }
</style>
{% endblock %}
